<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela 01</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            text-align: center;
            font-variant: small-caps;
            border: 1px solid ;
            max-width: 400px;
            border-radius: 24px;
            box-shadow: inset 1px 1px 1px black;
        }
        table.tabela1{
            width: 400px;
            height: 400px;
            border-collapse: collapse;
        }
        td{
            border: 1px solid black ;
            padding: 8px;
            text-align: center;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <h1>MINHA PRIMEIRA TABELA</h1>
    <!--
    HIERARQUIA DE TABELAS (simples)
    TABLE = tabela
        TABLE ROW = linha de tabela
        TABLE HEADER = cabeçalho da tabela
        TABLE DATA = dado da tabela
    -->
        <table class="tabela1">
            <tr class="linha1">
                <td class="t1">A1</td>
                <td class="t1">B1</td>
                <td class="t1">C1</td>
            </tr>
             <tr class="linha2">
                <td class="t1">A2</td>
                <td class="t1">B2</td>
                <td class="t1">C2</td>
            </tr>
             <tr class="linha3">
                <td class="t1">A3</td>
                <td class="t1">B3</td>
                <td class="t1">C3</td>
            </tr>
             <tr class="linha4">
                <td class="t1">A4</td>
                <td class="t1">B4</td>
                <td class="t1">C4</td>
            </tr>
        </table>
    <h1>MINHA SEGUNDA TABELA</h1>
    <!--
    ANATOMIA PRA TABELAS GRANDES
    TABLE
        THEAD
            TR TD TH
        TBODY
            TR TD TH
        TFOOT
            TR TD TH
    -->
    <table>
        <thead>
            <tr>
                <th>POSIÇÃO</th>
                <th>ESTADO</th>
                <th>POPULAÇÃO</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>São Paulo</td>
                <td>46 081 081</td>
            </tr>
        </tbody>
        <tfoot>

        </tfoot>
    </table>
</body>
</html>
